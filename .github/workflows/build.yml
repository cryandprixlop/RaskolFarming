name: Build RaskolFarming
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp clean package
      - run: jar tf target/RaskolFarming-1.0.0.jar | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: RaskolFarming-jar
          path: target/RaskolFarming-*.jar
